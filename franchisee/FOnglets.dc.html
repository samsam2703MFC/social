<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/l-atelier-by-8504a4e3-7796-44da-b087-3fbd9dcb8dcd/global.css">
  <script src="_ds/l-atelier-by-8504a4e3-7796-44da-b087-3fbd9dcb8dcd/_ds_bundle.js"></script>
  <script src="config.js"></script>
  <script src="franchise-data.js"></script>
</helmet>
<div class="sf-tabs" style="display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid rgba(34,34,34,0.14);font-family:var(--font-ui);">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
    <a href="{{ t.href }}" onClick="{{ t.click }}" style="display:flex;align-items:center;gap:7px;padding:10px 16px 9px;margin-bottom:-1px;border-bottom:2px solid {{ t.line }};font-size:14px;font-weight:{{ t.w }};color:{{ t.fg }};text-decoration:none;white-space:nowrap;">
      <span style="width:20px;height:20px;border-radius:6px;background:{{ t.icBg }};color:{{ t.icFg }};font-size:12px;display:flex;align-items:center;justify-content:center;">{{ t.ic }}</span>{{ t.label }}
    </a>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:48},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cal&quot;,&quot;analyse&quot;,&quot;suivi&quot;,&quot;com&quot;,&quot;pub&quot;],&quot;default&quot;:&quot;cal&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
// Les onglets de « Mes réseaux » : le calendrier, l'analyse des vues et des abonnés, le suivi de la boutique et
// la création d'un post, regroupés sous une seule entrée du menu. `onPick` (facultatif) : la page change d'onglet sans recharger.
class Component extends DCLogic {
  renderVals() {
    const SF = window.SF, st = SF && SF.state();
    if (!st) return { tabs: [] };
    const active = this.props.active || 'cal', pick = this.props.onPick;
    const defs = [['cal', 'Calendrier', '▦', SF.href('cal')]]
      .concat(st.rules.voirAnalyse !== false ? [['analyse', 'Vues et abonnés', '∿', SF.href('cal', 'vue=analyse')]] : [])
      .concat(st.rules.voirSuivi !== false ? [['suivi', 'Suivi de ma boutique', '↗', SF.href('cal', 'vue=suivi')]] : [])
      .concat(st.rules.voirCommentaires !== false ? [['com', 'Commentaires', '❝', SF.href('com')]] : [])
      .concat(st.rules.voirAvisGoogle !== false ? [['google', 'Avis Google', '★', SF.href('google')]] : [])
      .concat([['pub', 'Créer un post', '+', SF.href('pub')]]);
    return { tabs: defs.map(([k, label, ic, href]) => { const on = k === active;
      return { label, ic, href, fg: on ? '#8D1D2C' : '#444444', w: on ? 600 : 500, line: on ? '#8D1D2C' : 'transparent', icBg: on ? '#8D1D2C' : '#EAE4DC', icFg: on ? '#FFFFFF' : '#666666',
        click: (e) => { const VUES = ['cal', 'analyse', 'suivi']; if (typeof pick === 'function' && VUES.includes(k) && VUES.includes(active)) { e.preventDefault(); pick(k); } } }; }) };
  }
}
</script>
</body>
</html>
