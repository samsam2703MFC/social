<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/l-atelier-by-8504a4e3-7796-44da-b087-3fbd9dcb8dcd/global.css">
  <script src="_ds/l-atelier-by-8504a4e3-7796-44da-b087-3fbd9dcb8dcd/_ds_bundle.js"></script>
  <script src="social-data.js"></script>
</helmet>
<nav style="width:228px;height:100vh;position:sticky;top:0;box-sizing:border-box;overflow-y:auto;background:#FFFFFF;border-right:0.5px solid rgba(34,34,34,0.10);display:{{ navDisplay }};flex-direction:column;font-family:var(--font-ui);color:#222222;">
  <div style="padding:20px 20px 16px;display:flex;flex-direction:column;gap:6px;border-bottom:0.5px solid rgba(34,34,34,0.10);">
    <img src="img/logo.png" alt="L'Atelier By" style="height:20px;width:auto;align-self:flex-start;">
    <span style="font-size:11px;color:#666666;letter-spacing:0.08em;text-transform:uppercase;">Franchise Buddy</span>
  </div>
  <div style="padding:16px 12px 8px;display:flex;flex-direction:column;gap:2px;">
    <span style="font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#8D1D2C;padding:0 10px 2px;">Social &amp; Ads</span>
    <span style="font-size:11px;color:#8A847C;padding:0 10px 8px;">Développement publicitaire · réseaux sociaux</span>
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
      <a href="{{ it.href }}" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:{{ it.w }};color:{{ it.fg }};background:{{ it.bg }};" style-hover="background:#F4EFE8;">
        <span style="display:flex;align-items:center;gap:10px;">
          <span style="width:18px;height:18px;border-radius:5px;background:{{ it.numBg }};color:{{ it.numFg }};font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;flex:0 0 auto;">{{ it.n }}</span>
          {{ it.label }}
        </span>
        <sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}">
          <span style="min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#8D1D2C;color:#FFFFFF;font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;box-sizing:border-box;">{{ it.badge }}</span>
        </sc-if>
      </a>
    </sc-for>
    <!-- Paramètres : tout le paramétrage Meta (et du module), chaque entrée ouvre son onglet ou sa section -->
    <div style="display:flex;flex-direction:column;gap:1px;margin:2px 0 4px 30px;border-left:1px solid rgba(34,34,34,0.10);padding-left:6px;">
      <sc-for list="{{ setItems }}" as="si" hint-placeholder-count="12">
        <a href="{{ si.href }}" style="display:block;padding:5px 8px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:{{ si.w }};color:{{ si.fg }};background:{{ si.bg }};" style-hover="background:#F4EFE8;">{{ si.label }}</a>
      </sc-for>
    </div>
  </div>
  <div style="padding:8px 12px 8px;border-top:0.5px solid rgba(34,34,34,0.10);margin-top:6px;display:flex;flex-direction:column;gap:2px;">
    <span style="font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#8D1D2C;padding:0 10px 2px;">Recrutement</span>
    <span style="font-size:11px;color:#8A847C;padding:0 10px 8px;">Formulaires de candidature Meta</span>
    <sc-for list="{{ itemsRec }}" as="it" hint-placeholder-count="1">
      <a href="{{ it.href }}" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:{{ it.w }};color:{{ it.fg }};background:{{ it.bg }};" style-hover="background:#F4EFE8;">
        <span style="display:flex;align-items:center;gap:10px;">
          <span style="width:18px;height:18px;border-radius:5px;background:{{ it.numBg }};color:{{ it.numFg }};font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;flex:0 0 auto;">{{ it.n }}</span>
          {{ it.label }}
        </span>
        <sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}">
          <span style="min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#8D1D2C;color:#FFFFFF;font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;box-sizing:border-box;">{{ it.badge }}</span>
        </sc-if>
      </a>
    </sc-for>
  </div>
  <sc-if value="{{ hasAlerts }}" hint-placeholder-val="{{ false }}">
    <a href="{{ setHref }}" style="margin:8px 16px 0;padding:12px;border-radius:8px;background:#FCE7C8;color:#6b3d0a;text-decoration:none;display:flex;flex-direction:column;gap:4px;">
      <span style="font-size:12px;font-weight:500;">{{ alertTitle }}</span>
      <span style="font-size:11px;line-height:1.45;">{{ alertDetail }}</span>
    </a>
  </sc-if>
  <div style="margin-top:auto;padding:14px 20px 18px;border-top:0.5px solid rgba(34,34,34,0.10);display:flex;flex-direction:column;gap:8px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="width:30px;height:30px;border-radius:50%;background:#8D1D2C;color:#FFFFFF;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex:0 0 auto;">{{ userIni }}</span>
      <span style="display:flex;flex-direction:column;min-width:0;">
        <span style="font-size:13px;font-weight:500;">{{ userName }}</span>
        <span style="font-size:11px;color:#666666;">{{ userRole }}</span>
      </span>
    </div>
    <button onClick="{{ resetDemo }}" style="background:transparent;border:none;padding:4px 0;text-align:left;color:#666666;font-family:var(--font-ui);font-size:11px;cursor:pointer;text-decoration:underline;">{{ resetLabel }}</button>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:228,&quot;height&quot;:720},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cal&quot;,&quot;grid&quot;,&quot;fr&quot;,&quot;post&quot;,&quot;repost&quot;,&quot;camp&quot;,&quot;ads&quot;,&quot;roi&quot;,&quot;suivi&quot;,&quot;ctrl&quot;,&quot;set&quot;],&quot;default&quot;:&quot;cal&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() { this._h = () => this.forceUpdate(); window.addEventListener('sa-change', this._h); }
  componentWillUnmount() { window.removeEventListener('sa-change', this._h); }
  renderVals() {
    const SA = window.SA;
    const active = this.props.active || 'cal';
    const st = SA ? SA.state() : { posts: [] };
    const alerts = SA ? SA.alerts() : [];
    const toValidate = st.posts.filter(p => p.status === 'À valider').length;
    const failed = st.posts.filter(p => p.status === 'Échec' || p.partial).length;
    const refused = (st.ads || []).filter(a => a.status === 'Refusée').length;
    // Deux rubriques : le développement publicitaire sur les réseaux sociaux, et le
    // recrutement (formulaires de leads Meta), badge = leads reçus ces 7 derniers jours.
    const defs = [
      ['cal', 'Calendrier', toValidate + failed],
      ['grid', 'Grille Instagram', 0],
      ['post', 'Créer un post', 0],
      // Maquette : les posts de la Page de la marque repris automatiquement par les Pages des boutiques.
      ['repost', 'Repost auto', 0],
      ['camp', 'Opérations', 0],
      // Les refusées à corriger, et les demandes de boost des boutiques à traiter.
      ['ads', 'Publicités Meta', refused + ((st.alertes || {}).boost || 0)],
      ['roi', 'Retour sur opération', 0],
      ['bilan', 'Bilan des boutiques', 0],
      ['suivi', 'Suivi des boutiques', 0],
      ['ctrl', 'Contrôle', 0],
      // Avis Google : ce que le réseau doit traiter (ses rouges, ce que les boutiques ont laissé passer au-delà du délai).
      // Commentaires et messages privés : seulement dans l'espace franchisé.
      ['google', 'Avis Google', ((st.alertes || {}).google || {}).pourReseau || 0],
      ['fr', 'Espace franchisé', st.posts.filter(p => p.origin === 'franchise' && p.status === 'À valider').length],
      ['set', 'Paramètres', alerts.length],
    ];
    const since = SA ? SA.addDays(SA.TODAY, -7) : '';
    const newLeads = SA ? (SA.LEADS || []).filter(l => String(l.created_time || '').slice(0, 10) >= since).length : 0;
    const defsRec = [['leads', 'Formulaires de leads', newLeads]];
    const mk = (list) => list.map(([k, label, badge], i) => {
      const on = k === active;
      return { n: i + 1, label, href: SA ? SA.href(k) : '#', badge, hasBadge: badge > 0,
        fg: on ? '#8D1D2C' : '#222222', bg: on ? '#F4EFE8' : 'transparent', w: on ? 500 : 400,
        numBg: on ? '#8D1D2C' : '#EAE4DC', numFg: on ? '#FFFFFF' : '#666666' };
    });
    const shops = [...new Set(alerts.map(a => a.shop))];
    return {
      navDisplay: SA && SA.embed ? 'none' : 'flex',
      // Sous « Paramètres » : chaque réglage (Meta en tête), ouvert sur son onglet ou sa section (?tab=…&section=…).
      setItems: [['conn', '', 'Connexions Meta'], ['api', 'cles', 'Clés d’accès & token'], ['api', 'ids', 'Identifiants par boutique'], ['api', 'pf', 'Portefeuille Business Manager'],
        ['api', 'version', 'Version & permissions'], ['api', 'dsa', 'Transparence UE (DSA)'], ['google', '', 'Connexions Google'], ['ia', '', 'Rédaction IA & charte'], ['tpl', '', 'Modèles de posts'], ['grp', '', 'Groupes de boutiques'],
        ['rights', '', 'Droits'], ['log', '', 'Journal d’activité'], ['tfb', '', 'API TFBuddy']]
        .filter(([tab]) => tab !== 'tfb' || (SA && SA.live))
        .map(([tab, sec, label]) => {
          const on = active === 'set' && ((SA && SA.param('tab')) || 'conn') === tab && ((SA && SA.param('section')) || '') === sec;
          return { label, href: SA ? SA.href('set', 'tab=' + tab + (sec ? '&section=' + sec : '')) : '#', fg: on ? '#8D1D2C' : '#555555', bg: on ? '#F4EFE8' : 'transparent', w: on ? 500 : 400 };
        }),
      items: mk(defs), itemsRec: mk(defsRec), hasAlerts: alerts.length > 0, setHref: SA ? SA.href('set') : '#',
      alertTitle: alerts.length + (alerts.length > 1 ? ' connexions à rétablir' : ' connexion à rétablir'),
      alertDetail: alerts.map(a => a.shop + ' · ' + a.what + ' (' + (SA.CONN[a.st] || {}).label + ')').join(' — '),
      userName: SA ? SA.user.name : '', userIni: SA ? SA.user.name.split(/\s+/).map(x => x[0] || '').join('').slice(0, 2).toUpperCase() : '',
      userRole: SA ? SA.user.role + ' · ' + SA.SHOPS.length + ' boutique' + (SA.SHOPS.length > 1 ? 's' : '') : '',
      resetLabel: SA && SA.live ? '← Retour au cockpit' : 'Réinitialiser les données de démo',
      resetDemo: () => { if (!SA) return; if (SA.live) { location.href = SA.boUrl || '/consulant_bo/'; return; } SA.reset(); location.reload(); },
    };
  }
}
</script>
</body>
</html>
